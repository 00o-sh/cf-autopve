name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: npm audit signatures
        # The registry's attestation endpoint sometimes answers a plain "OK" instead of JSON,
        # which npm reports as FETCH_ERROR. Retry only that; a signature that fails still fails.
        run: |
          for i in 1 2 3; do
            if out=$(npm audit signatures 2>&1); then echo "$out"; exit 0; fi
            echo "$out"
            grep -q FETCH_ERROR <<<"$out" || exit 1
            echo "::warning::npm registry returned an invalid response (attempt $i of 3); retrying"
            sleep $((i * 10))
          done
          exit 1
      - run: npm run typecheck
      - run: npm test
      - name: Bundle check
        run: npx wrangler deploy --dry-run --outdir dist
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: shellcheck scripts/*.sh
