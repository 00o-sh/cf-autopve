name = "autopve"
main = "src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = false
routes = [{ pattern = "autopve.00o.sh", custom_domain = true }]

# The configurator UI. The Worker runs first so it can verify the Cloudflare
# Access JWT itself (defence in depth) before handing the request to the assets.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "autopve"
database_id = "483d7b40-0907-41c2-a84c-fd567e84f0aa"

# Optional: first-boot files larger than FILE_MAX_BYTES need R2.
# Uncomment after `npx wrangler r2 bucket create autopve-files`.
# [[r2_buckets]]
# binding = "FILES"
# bucket_name = "autopve-files"


[vars]
# --- Cloudflare Access (protects the configurator UI + /api) ---
ACCESS_TEAM_DOMAIN = "https://bitbybit.cloudflareaccess.com"
ACCESS_AUD = "d1c9f2d9842c6b0ae4261c265632a3ded9f5e7056a50ccee62d540dda5bb0695"

# --- Secret-hosting guardrails (see README "Hosting secrets") ---
# Default arm window, in minutes, used by the "Arm" button.
ARM_DEFAULT_MINUTES = "30"
# Refuse to ever serve an answer containing plaintext secrets over plain HTTP.
REQUIRE_HTTPS = "true"
# Allow serve_mode = "always" on answers that contain secrets. Keep "false".
ALLOW_ALWAYS_SECRETS = "false"
# Requests per minute per client IP against /answer and /hook.
RATE_LIMIT_PER_MIN = "30"
# Max size of a file hosted in D1 (bytes). Above this you need the R2 binding.
FILE_MAX_BYTES = "1000000"
# Max stored system_info blob per history row (bytes).
HISTORY_MAX_BYTES = "131072"
# History rows to keep (older rows are trimmed on write).
HISTORY_LIMIT = "1000"
ANSWER_VERSIONS_KEEP = "50"
# Answer format: "auto" sends JSON when the installer prefers it (it does, on current ISOs),
# otherwise TOML. "toml" always sends TOML.
ANSWER_FORMAT = "auto"

# Secrets (set with `npx wrangler secret put <NAME>`), never in this file:
#   ANSWER_ENC_KEY  - base64 32-byte AES-256-GCM key. REQUIRED to store any secret value.
#   SERVE_TOKEN     - optional shared token; when set, /answer and /hook require
#                     /answer/<token> in the path or an X-AutoPVE-Token header.

# --- Worker Previews (`wrangler preview`, run by Workers Builds for every PR) ---
# Previews run a PR's code before review, so they get their own empty database:
# never point this at production. Schema: npx wrangler d1 migrations apply autopve-preview --remote
# Every key in [vars] must also be listed here (test/logic.test.js checks it).
# The Access values are production's: the preview hostname is not behind the Access app,
# so the preview UI stays locked (401) and only the installer endpoints answer.
# Never set DEV_ALLOW_INSECURE_UI here. Preview secrets: npx wrangler preview secret put.
[[previews.d1_databases]]
binding = "DB"
database_name = "autopve-preview"
database_id = "8fc4644f-e7f8-4c65-80b5-a8e8c38f8c88"

[previews.vars]
ACCESS_TEAM_DOMAIN = "https://bitbybit.cloudflareaccess.com"
ACCESS_AUD = "d1c9f2d9842c6b0ae4261c265632a3ded9f5e7056a50ccee62d540dda5bb0695"
ARM_DEFAULT_MINUTES = "30"
REQUIRE_HTTPS = "true"
ALLOW_ALWAYS_SECRETS = "false"
RATE_LIMIT_PER_MIN = "30"
FILE_MAX_BYTES = "1000000"
HISTORY_MAX_BYTES = "131072"
HISTORY_LIMIT = "1000"
ANSWER_FORMAT = "auto"
